<!doctype html><html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chyper Vitalize</title><script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:#f4f1e9;color:#171717}header{height:66px;background:#111;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 5vw}.brand{font-weight:900;letter-spacing:.12em}.wrap{max-width:1180px;margin:28px auto;padding:0 18px}.card{background:#fff;border:1px solid #ddd8cc;border-radius:18px;padding:22px;box-shadow:0 10px 35px #0000000b}.grid{display:grid;grid-template-columns:360px 1fr;gap:24px}h1{font-size:28px;margin:0 0 8px}h2{font-size:16px;margin:20px 0 8px}label{display:block;font-size:12px;font-weight:700;margin:11px 0 5px}input,textarea,select{width:100%;padding:11px 12px;border:1px solid #d4d0c7;border-radius:9px;font:inherit}textarea{min-height:90px;resize:vertical}button{border:0;border-radius:10px;padding:12px 15px;font-weight:800;cursor:pointer}.primary{background:#111;color:#fff;width:100%;margin-top:12px}.secondary{background:#eeeae1;color:#111;width:100%;margin-top:8px}.cv{width:min(100%,794px);min-height:1123px;background:#fffdf7;margin:auto;box-shadow:0 12px 40px #0002;position:relative;padding:62px 58px}.bar{position:absolute;left:0;right:0;top:0;height:16px;background:#7b2d2d}.cv h3{font-size:34px;margin:0}.role{font-size:16px;margin:5px 0 16px;color:#555}.contact{font-size:12px;border-bottom:1px solid #ccc;padding-bottom:14px}.section{margin-top:24px}.section b{display:block;text-transform:uppercase;letter-spacing:.12em;font-size:12px;margin-bottom:8px}.section p{white-space:pre-wrap;font-size:13px;line-height:1.55;margin:0}.skills{display:flex;flex-wrap:wrap;gap:7px}.skill{border:1px solid #bbb;padding:5px 8px;border-radius:99px;font-size:11px}.modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:20px}.modal.open{display:flex}.pay{width:min(430px,100%);background:#fff;border-radius:18px;padding:22px}.price{font-size:34px;font-weight:900;margin:14px 0}.old{text-decoration:line-through;color:#888;font-size:18px}.ok{display:none;background:#e9f7ed;color:#17602d;padding:10px;border-radius:9px;margin-top:10px}@media(max-width:850px){.grid{grid-template-columns:1fr}.cv{min-height:900px;padding:45px 35px}}</style></head><body><header><div class="brand">CHYPER VITALIZE</div><div>AI CV Builder</div></header><div class="wrap"><div class="grid"><div class="card"><h1>CV szerkesztő</h1><p>Élő előnézet és szerveroldali PDF-letöltés.</p><label>Nyelv</label><select id="lang"><option>Magyar</option><option>English (US)</option><option>English (UK)</option><option>Deutsch</option><option>Français</option><option>Español</option><option>Italiano</option><option>Português</option><option>Nederlands</option><option>Polski</option><option>Čeština</option><option>Slovenčina</option><option>Română</option><option>Hrvatski</option><option>Slovenščina</option><option>Srpski</option><option>Български</option><option>Ελληνικά</option><option>Dansk</option><option>Svenska</option><option>Norsk</option><option>Suomi</option><option>Eesti</option><option>Latviešu</option><option>Lietuvių</option><option>Türkçe</option><option>Українська</option><option>Русский</option><option>हिन्दी</option><option>中文</option><option>日本語</option><option>한국어</option><option>العربية</option></select><label>Teljes név</label><input id="name" value="Kovács Márton"><label>Szakmai cím</label><input id="role" value="Értékesítési munkatárs"><label>Email</label><input id="email" value="marton@example.com"><label>Telefon</label><input id="phone" value="+36 30 123 4567"><label>Város / ország</label><input id="city" value="Budapest, Magyarország"><label>Profil / összefoglaló</label><textarea id="summary">Motivált és megbízható szakember, erős kommunikációs és ügyfélkezelési készségekkel.</textarea><label>Készségek</label><input id="skills" value="Kommunikáció, Értékesítés, Csapatmunka, Problémamegoldás"><label>Tapasztalat</label><textarea id="experience">Értékesítési munkatárs — Minta Kft.\n2024–2026\nÜgyfelek támogatása, értékesítés és napi operatív feladatok.</textarea><label>Tanulmányok</label><textarea id="education">Középiskolai érettségi — 2024</textarea><label>Nyelvek</label><input id="languages" value="Magyar — anyanyelv, Angol — középfok"><label>Díszítő szín</label><input id="accent" type="color" value="#7b2d2d"><button class="primary" onclick="openPay()">CV letöltése · Fizetés</button></div><div><div class="cv" id="cv"><div class="bar" id="bar"></div><h3 id="pname"></h3><div class="role" id="prole"></div><div class="contact" id="pcontact"></div><div class="section"><b>Profil</b><p id="psummary"></p></div><div class="section"><b>Készségek</b><div class="skills" id="pskills"></div></div><div class="section"><b>Tapasztalat</b><p id="pexperience"></p></div><div class="section"><b>Tanulmányok</b><p id="peducation"></p></div><div class="section"><b>Nyelvek</b><p id="planguages"></p></div></div></div></div></div><div class="modal" id="modal"><div class="pay"><button style="float:right" onclick="closePay()">✕</button><h1>PDF letöltés</h1><p>A fizetés jelenleg demó módban van.</p><div class="price" id="price">€3.99</div><label>Referral kód</label><input id="ref" placeholder="Írd be a kódot"><button class="secondary" onclick="applyRef()">50% kedvezmény alkalmazása</button><div class="ok" id="ok">✓ 50% kedvezmény aktiválva — fizetendő: €1.99</div><button class="primary" id="paybtn" onclick="pay()">Demó fizetés · €3.99</button><button class="primary" id="pdfbtn" style="display:none;background:#166534" onclick="downloadPDF()">PDF letöltése</button></div></div><script>const ids=['name','role','email','phone','city','summary','skills','experience','education','languages'];function render(){pname.textContent=name.value;prole.textContent=role.value;pcontact.textContent=[email.value,phone.value,city.value].filter(Boolean).join('  •  ');psummary.textContent=summary.value;pexperience.textContent=experience.value;peducation.textContent=education.value;planguages.textContent=languages.value;pskills.innerHTML='';skills.value.split(',').filter(x=>x.trim()).forEach(x=>{let s=document.createElement('span');s.className='skill';s.textContent=x.trim();pskills.appendChild(s)});bar.style.background=accent.value}ids.forEach(x=>document.getElementById(x).addEventListener('input',render));accent.addEventListener('input',render);render();function openPay(){scrollTo(0,0);modal.classList.add('open')}function closePay(){modal.classList.remove('open')}let discounted=false;function applyRef(){if(!ref.value.trim())return;discounted=true;price.innerHTML='<span class="old">€3.99</span> €1.99';ok.style.display='block';paybtn.textContent='Demó fizetés · €1.99'}function pay(){paybtn.style.display='none';pdfbtn.style.display='block'}async function downloadPDF(){pdfbtn.disabled=true;pdfbtn.textContent='PDF készítése…';try{const c=await html2canvas(cv,{scale:2,backgroundColor:'#fffdf7'});const r=await fetch('/api/pdf',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({image:c.toDataURL('image/jpeg',.94),name:name.value})});if(!r.ok)throw Error();const b=await r.blob(),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='Chyper_Vitalize_'+(name.value||'CV').replace(/[^A-Za-z0-9_-]/g,'_')+'.pdf';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),3000)}catch(e){alert('A PDF készítése nem sikerült. Próbáld újra.')}finally{pdfbtn.disabled=false;pdfbtn.textContent='PDF letöltése'}}</script></body></html>
